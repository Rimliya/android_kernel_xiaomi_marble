name: Build Melt Kernel for Marble (Clang 17)

on:
  push:
    branches:
      - melt-rebase
  workflow_dispatch:

jobs:
  build_kernel:
    name: Compile Melt Kernel (marble)
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: Pzqqt/android_kernel_xiaomi_marble
          ref: melt-rebase
          path: kernel_source
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            git gnupg gperf \
            libelf-dev libffi-dev liblz4-tool \
            libncurses-dev \
            libssl-dev libxml2 libxml2-utils \
            llvm lld lzop python3 python3-pip \
            rsync squashfs-tools zip zlib1g-dev \
            device-tree-compiler \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          
          pip3 install pycryptodome

      - name: Setup Clang 17 Toolchain
        run: |
          # 使用 Clang 17.0.6 (最新稳定版)
          CLANG_VERSION="17.0.6"
          ARCHIVE_NAME="clang+llvm-${CLANG_VERSION}-x86_64-linux-gnu-ubuntu-22.04.tar.xz"
          
          # 从清华镜像下载（更快更可靠）
          MIRROR_URL="https://mirrors.tuna.tsinghua.edu.cn/github-release/llvm/llvm-project/LatestRelease"
          wget -q --tries=3 --timeout=30 "${MIRROR_URL}/${ARCHIVE_NAME}" || \
          wget -q --tries=3 --timeout=30 "https://github.com/llvm/llvm-project/releases/download/llvmorg-${CLANG_VERSION}/${ARCHIVE_NAME}"
          
          # 安装到工作目录
          mkdir -p clang-17
          tar -xf "${ARCHIVE_NAME}" -C clang-17 --strip-components=1
          
          # 设置环境变量
          echo "$(pwd)/clang-17/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=$(pwd)/clang-17/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          
          # 验证安装
          clang-17/bin/clang --version

      - name: Prepare Build Environment
        run: |
          mkdir -p $GITHUB_WORKSPACE/out
          
          # 设置所有环境变量（不含注释）
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV
          echo "LD=ld.lld" >> $GITHUB_ENV
          echo "AR=llvm-ar" >> $GITHUB_ENV
          echo "NM=llvm-nm" >> $GITHUB_ENV
          echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
          echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
          echo "STRIP=llvm-strip" >> $GITHUB_ENV
          echo "KERNEL_DIR=$GITHUB_WORKSPACE/kernel_source" >> $GITHUB_ENV
          echo "OUT_DIR=$GITHUB_WORKSPACE/out" >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=GitHubActions" >> $GITHUB_ENV
          echo "KBUILD_BUILD_HOST=CI-Server" >> $GITHUB_ENV
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> $GITHUB_ENV
          
          # Clang 特定标志（针对 Android 内核）
          echo "CLANG_FLAGS=-Qunused-arguments -fno-addrsig" >> $GITHUB_ENV
          
          ccache --max-size=2G

      - name: Apply Defconfig
        run: |
          cd $KERNEL_DIR
          make O=$OUT_DIR clean
          make O=$OUT_DIR mrproper
          make O=$OUT_DIR marble_defconfig
          
          # 添加 Clang 17 特定配置
          ./scripts/config --file $OUT_DIR/.config \
            -e LTO_CLANG_THIN \
            -e THINLTO \
            -d LTO_NONE

      - name: Compile Kernel with Clang 17
        run: |
          cd $KERNEL_DIR
          
          # 添加 Clang 17 编译标志
          EXTRA_CFLAGS="-mllvm -polly -mllvm -polly-vectorizer=stripmine"
          
          time make O=$OUT_DIR -j$(nproc --all) \
            CC="$CC" \
            LD="$LD" \
            AR="$AR" \
            NM="$NM" \
            OBJCOPY="$OBJCOPY" \
            OBJDUMP="$OBJDUMP" \
            STRIP="$STRIP" \
            CLANG_FLAGS="$CLANG_FLAGS" \
            EXTRA_CFLAGS="$EXTRA_CFLAGS" \
            2>&1 | tee build.log
          
          # 验证核心产物存在
          if [ ! -f "$OUT_DIR/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "❌ 核心镜像未生成，编译失败！"
            echo "=== 编译日志最后100行 ==="
            tail -n 100 build.log
            echo "========================="
            exit 1
          fi
          
          echo "✅ 编译成功！产物大小:"
          ls -lh $OUT_DIR/arch/arm64/boot/Image.gz-dtb

      - name: Package Artifacts
        run: |
          RELEASE_DIR="$GITHUB_WORKSPACE/release"
          mkdir -p $RELEASE_DIR
          
          # 复制主要产物
          cp $OUT_DIR/arch/arm64/boot/Image.gz-dtb $RELEASE_DIR/
          
          # 复制所有 DTB 文件
          find $OUT_DIR/arch/arm64/boot/dts -name "*.dtb" -exec cp {} $RELEASE_DIR/ \;
          
          # 复制模块
          find $OUT_DIR -name "*.ko" -exec cp {} $RELEASE_DIR/ \;
          
          # 复制调试文件
          cp $OUT_DIR/vmlinux $RELEASE_DIR/
          cp $OUT_DIR/.config $RELEASE_DIR/
          
          echo "📦 打包完成:"
          ls -lh $RELEASE_DIR

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MeltKernel-marble-Clang17-${{ github.run_id }}
          path: $GITHUB_WORKSPACE/release
          retention-days: 7

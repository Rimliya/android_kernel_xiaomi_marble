name: Build Melt Kernel for Marble

on:
  push:
    branches:
      - melt-rebase
  workflow_dispatch:

jobs:
  build_kernel:
    name: Compile Melt Kernel (marble)
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: Pzqqt/android_kernel_xiaomi_marble
          ref: melt-rebase
          path: kernel_source
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -y
          
          # 先安装基础工具链
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            git gnupg gperf \
            libelf-dev libffi-dev liblz4-tool \
            libncurses-dev libncurses5 \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            llvm lld clang lzop pngcrush python3 python3-pip \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            device-tree-compiler
          
          # 单独安装交叉编译工具链（避免冲突）
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          
          pip3 install pycryptodome

      - name: Setup Clang Toolchain
        run: |
          CLANG_VERSION="14.0.6"
          CLANG_ARCHIVE="clang+llvm-${CLANG_VERSION}-x86_64-linux-gnu-ubuntu-18.04.tar.xz"
          
          wget -q "https://github.com/llvm/llvm-project/releases/download/llvmorg-${CLANG_VERSION}/${CLANG_ARCHIVE}"
          
          sudo mkdir -p /usr/local/clang-llvm
          sudo tar -xf ${CLANG_ARCHIVE} -C /usr/local/clang-llvm --strip-components=1
          
          echo "/usr/local/clang-llvm/bin" | sudo tee -a /etc/environment
          echo "LD_LIBRARY_PATH=/usr/local/clang-llvm/lib:$LD_LIBRARY_PATH" | sudo tee -a /etc/environment
          
          /usr/local/clang-llvm/bin/clang --version

      - name: Prepare Build Environment
        run: |
          mkdir -p $GITHUB_WORKSPACE/out
          
          # 设置所有环境变量
          cat <<EOF >> $GITHUB_ENV
          ARCH=arm64
          SUBARCH=arm64
          CROSS_COMPILE=aarch64-linux-gnu-
          CLANG_TRIPLE=aarch64-linux-gnu-
          CC=clang
          LD=ld.lld
          AR=llvm-ar
          NM=llvm-nm
          OBJCOPY=llvm-objcopy
          OBJDUMP=llvm-objdump
          STRIP=llvm-strip
          PATH=/usr/local/clang-llvm/bin:$PATH
          KERNEL_DIR=$GITHUB_WORKSPACE/kernel_source
          OUT_DIR=$GITHUB_WORKSPACE/out
          KBUILD_BUILD_USER=GitHubActions
          KBUILD_BUILD_HOST=CI-Server
          CCACHE_DIR=$GITHUB_WORKSPACE/.ccache
          EOF
          
          ccache --max-size=2G

      - name: Apply Defconfig
        run: |
          cd $KERNEL_DIR
          make O=$OUT_DIR clean
          make O=$OUT_DIR mrproper
          make O=$OUT_DIR marble_defconfig

      - name: Compile Kernel
        run: |
          cd $KERNEL_DIR
          time make O=$OUT_DIR -j$(nproc --all) 2>&1 | tee build.log
          
          # 验证核心产物存在
          if [ ! -f "$OUT_DIR/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "❌ 核心镜像未生成，编译失败！"
            echo "=== 编译日志最后100行 ==="
            tail -n 100 build.log
            echo "========================="
            exit 1
          fi
          
          echo "✅ 编译成功！产物大小:"
          ls -lh $OUT_DIR/arch/arm64/boot/Image.gz-dtb

      - name: Package Artifacts
        run: |
          RELEASE_DIR="$GITHUB_WORKSPACE/release"
          mkdir -p $RELEASE_DIR
          
          # 复制主要产物
          cp $OUT_DIR/arch/arm64/boot/Image.gz-dtb $RELEASE_DIR/
          
          # 尝试复制其他可能存在的文件
          find $OUT_DIR/arch/arm64/boot -name "*.dtb" -exec cp {} $RELEASE_DIR/ \;
          [ -f "$OUT_DIR/arch/arm64/boot/dtbo.img" ] && cp $OUT_DIR/arch/arm64/boot/dtbo.img $RELEASE_DIR/
          
          # 复制调试文件
          cp $OUT_DIR/vmlinux $RELEASE_DIR/
          cp $OUT_DIR/.config $RELEASE_DIR/
          
          echo "📦 打包完成:"
          ls -lh $RELEASE_DIR

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MeltKernel-marble-${{ github.run_id }}
          path: $GITHUB_WORKSPACE/release
          retention-days: 7

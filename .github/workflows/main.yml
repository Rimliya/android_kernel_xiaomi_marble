name: Build Melt Kernel (marble) with Clang 17

on:
  push:
    branches:
      - melt-rebase # 监控 Pzqqt/android_kernel_xiaomi_marble 的 melt-rebase 分支
  workflow_dispatch: # 允许手动触发

env:
  ARCH: arm64
  KERNEL_REPO_URL: https://github.com/Pzqqt/android_kernel_xiaomi_marble.git
  KERNEL_BRANCH: melt-rebase # 或特定 commit/tag
  DEFCONFIG_NAME: marble_defconfig # 假设 defconfig 位于 arch/arm64/configs/marble_defconfig
  CLANG_VERSION: 17
  OUTPUT_ARTIFACT_NAME: melt kernel-test
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_ARM32: arm-linux-gnueabi- # 如果内核需要编译32位组件

jobs:
  build_kernel:
    name: Build Kernel for ${{ env.ARCH }} with Clang ${{ env.CLANG_VERSION }}
    runs-on: ubuntu-latest # 使用最新的 Ubuntu 运行器
    permissions:
      contents: read # 允许读取仓库内容

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO_URL }}
          ref: ${{ env.KERNEL_BRANCH }}
          fetch-depth: 1 # 浅克隆，加快检出速度

      - name: Install Build Dependencies and Clang ${{ env.CLANG_VERSION }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache \
            curl flex g++-multilib gcc-multilib git gnupg gperf \
            libelf-dev liblz4-tool libncurses5-dev libncurses5 \
            libssl-dev make \
            python3 python3-pip \
            device-tree-compiler wget xz-utils zip \
            llvm lld # 基础包，llvm.sh 会安装特定版本
          
          # Install Clang and LLVM tools using llvm.sh
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo./llvm.sh ${{ env.CLANG_VERSION }} all
          sudo rm llvm.sh

          # Verify Clang installation
          clang-${{ env.CLANG_VERSION }} --version
          echo "Clang path: $(which clang-${{ env.CLANG_VERSION }})"

      - name: Add Clang to PATH and Set Environment Variables
        run: |
          echo "/usr/lib/llvm-${{ env.CLANG_VERSION }}/bin" >> $GITHUB_PATH
          echo "CC=clang" >> $GITHUB_ENV # Kbuild 将使用 PATH 中的 clang (应为 clang-17)
          echo "LD=ld.lld" >> $GITHUB_ENV
          echo "AR=llvm-ar" >> $GITHUB_ENV
          echo "NM=llvm-nm" >> $GITHUB_ENV
          echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
          echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
          echo "STRIP=llvm-strip" >> $GITHUB_ENV
          echo "HOSTCC=clang" >> $GITHUB_ENV
          echo "HOSTCXX=clang++" >> $GITHUB_ENV
          echo "LLVM=1" >> $GITHUB_ENV
          echo "LLVM_IAS=1" >> $GITHUB_ENV
          # 确保 ccache 在 PATH 中 (如果已安装)
          echo "/usr/lib/ccache" >> $GITHUB_PATH

      - name: Configure ccache (Optional)
        run: |
          ccache -M 10G # 设置 ccache 最大缓存大小
          ccache -z   # 清零统计数据

      - name: Prepare Kernel Configuration
        working-directory: ${{ github.workspace }}
        run: |
          make O=out mrproper
          make O=out ARCH=${{ env.ARCH }} ${{ env.DEFCONFIG_NAME }}

      - name: Compile Kernel
        working-directory: ${{ github.workspace }}
        run: |
          # 使用 ccache (如果可用)
          # Kbuild 会自动检测 ccache (如果 clang 前缀是 ccache clang)
          # 或者通过 export CC="ccache clang"
          # 这里我们依赖 Kbuild 对 PATH 中 ccache 的检测
          make O=out ARCH=${{ env.ARCH }} \
            CLANG_TRIPLE=${{ env.CROSS_COMPILE }} \
            CROSS_COMPILE=${{ env.CROSS_COMPILE }} \
            CROSS_COMPILE_ARM32=${{ env.CROSS_COMPILE_ARM32 }} \
            -j$(nproc --all)

      - name: Determine Kernel Image Name
        id: kernel_image
        working-directory: ${{ github.workspace }}/out/arch/${{ env.ARCH }}/boot
        run: |
          if [ -f Image.lz4 ]; then
            echo "name=Image.lz4" >> $GITHUB_OUTPUT
          elif [ -f Image.gz ]; then
            echo "name=Image.gz" >> $GITHUB_OUTPUT
          elif [ -f Image ]; then
            echo "name=Image" >> $GITHUB_OUTPUT
          else
            echo "Kernel image not found!"
            exit 1
          fi
          echo "Found kernel image: ${{ steps.kernel_image.outputs.name }}"

      - name: Package Kernel Artifacts
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p kernel_artifact
          cp out/arch/${{ env.ARCH }}/boot/${{ steps.kernel_image.outputs.name }} kernel_artifact/${{ steps.kernel_image.outputs.name }}
          if; then
            cp out/arch/${{ env.ARCH }}/boot/dtbo.img kernel_artifact/dtbo.img
          fi
          # 复制所有生成的 dtb 文件 (通常在 dts 子目录中)
          find out/arch/${{ env.ARCH }}/boot/dts/ -name "*.dtb" -exec cp {} kernel_artifact/ \;
          cp out/.config kernel_artifact/kernel_config.txt # 保存本次编译的配置
          # 可选：复制 vmlinux 和 System.map
          cp out/vmlinux kernel_artifact/vmlinux
          cp out/System.map kernel_artifact/System.map
          
          cd kernel_artifact
          zip -r9 ${{ github.workspace }}/${{ env.OUTPUT_ARTIFACT_NAME }}.zip.
          cd..

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_ARTIFACT_NAME }}
          path: ${{ github.workspace }}/${{ env.OUTPUT_ARTIFACT_NAME }}.zip
          if-no-files-found: error # 如果文件未找到则报错
          retention-days: 7 # 产物保留天数

      - name: Display ccache statistics (Optional)
        if: always() # 总是运行，即使之前的步骤失败
        run: |
          ccache -s

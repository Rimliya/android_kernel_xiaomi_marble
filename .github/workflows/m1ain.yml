name: Android Kernel Builder

on:
  workflow_dispatch:
  push:
    branches: [ melt-rebase ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libelf-dev libssl-dev ccache
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Set up Clang Toolchain
        run: |
          git clone --depth=1 https://gitlab.com/ElectroPerf/atom-x-clang.git clang

      - name: Debug toolchain setup
        run: |
          echo "Clang version:"
          clang/bin/clang --version
          echo "ld.lld version:"
          clang/bin/ld.lld --version
          echo "PATH: $PATH"

      - name: Compile Kernel
        env:
          ARCH: arm64
          CLANG_PATH: ${{ github.workspace }}/clang/bin
          DEFCONFIG: marble_defconfig
        run: |
          set -e  # 出错时立即退出
          export PATH=$CLANG_PATH:/usr/bin:$PATH
          export REAL_CROSS_COMPILE=aarch64-linux-gnu-
          
          # 配置阶段
          make O=out $DEFCONFIG LLVM=1 LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=$REAL_CROSS_COMPILE

          # 编译阶段
          make -j$(nproc) O=out LLVM=1 LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=$REAL_CROSS_COMPILE

          # 验证输出文件存在
          echo "编译完成，检查输出文件:"
          ls -la out/arch/arm64/boot/
          if [ ! -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "错误: Image.gz-dtb 文件未生成!"
            echo "可能的编译日志:"
            cat out/build.log || true
            exit 1
          fi

      - name: Pack with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ || { echo "复制内核镜像失败"; exit 1; }
          cd AnyKernel3
          sed -i 's/device.name1=.*/device.name1=marble/' anykernel.sh
          zip -r9 kernel_marble.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel_marble
          path: AnyKernel3/kernel_marble.zip

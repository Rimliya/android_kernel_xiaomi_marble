name: Android Kernel Builder

on:
  workflow_dispatch:
  push:
    branches: [ melt-rebase ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libelf-dev libssl-dev ccache
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          sudo apt-get install -y device-tree-compiler

      - name: Set up Clang Toolchain
        run: |
          git clone --depth=1 https://gitlab.com/ElectroPerf/atom-x-clang.git clang

      - name: Compile Kernel
        env:
          ARCH: arm64
          CLANG_PATH: ${{ github.workspace }}/clang/bin
          DEFCONFIG: marble_defconfig
        run: |
          set -e
          export PATH=$CLANG_PATH:/usr/bin:$PATH
          export REAL_CROSS_COMPILE=aarch64-linux-gnu-
          
          # 配置阶段
          make O=out $DEFCONFIG LLVM=1 LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=$REAL_CROSS_COMPILE

          # 编译内核镜像和设备树分开进行
          make -j$(nproc) O=out LLVM=1 LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=$REAL_CROSS_COMPILE \
            Image.gz
            
          make -j$(nproc) O=out LLVM=1 LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=$REAL_CROSS_COMPILE \
            dtbs

          # 手动创建Image.gz-dtb
          echo "手动创建Image.gz-dtb..."
          cd out/arch/arm64/boot
          cat Image.gz dts/*.dtb > Image.gz-dtb
          cd -
          
          # 验证输出
          echo "检查输出文件:"
          ls -la out/arch/arm64/boot/
          if [ ! -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "错误: Image.gz-dtb 文件未生成!"
            exit 1
          fi

      - name: Pack with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          sed -i 's/device.name1=.*/device.name1=marble/' anykernel.sh
          zip -r9 kernel_marble.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel_marble
          path: AnyKernel3/kernel_marble.zip
